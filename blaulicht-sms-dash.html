<script type="text/javascript">
    RED.nodes.registerType('bl-sms-dash', {
        category: 'network',
        color: '#ffffff',
        defaults: {
            customerId: { value: '', required: false },
            interval: {
                value: 10,
                required: true,
                validate: RED.validators.number()
            },
            updateOnly: { value: false },
            name: { value: '' }
        },
        credentials: {
            token: { type: 'password' },
            username: { type: 'text' },
            password: { type: 'password' }
        },
        inputs: 0,
        outputs: 1,
        icon: 'blsms-logo.png',
        label: function () {
            return this.name || 'BlaulichtSMS Dashboard';
        },
        oneditprepare: function () {
            const loginType = $('#node-input-loginType');
            const updateVisibility = function () {
                const useToken = loginType.val() === 'token';
                $('.node-type-token').toggle(useToken);
                $('.node-type-credentials').toggle(!useToken);
            };

            const hasCustomerCredentials = Boolean(this.customerId || this.kid || this.user);
            loginType.val(hasCustomerCredentials ? 'credentials' : 'token');
            loginType.on('change', updateVisibility);
            updateVisibility();
        },
        oneditsave: function () {
            if ($('#node-input-loginType').val() === 'token') {
                $('#node-input-customerId').val('');
                $('#node-input-username').val('');
                $('#node-input-password').val('');
            } else {
                $('#node-input-token').val('');
            }
        }
    });
</script>

<script type="text/html" data-template-name="bl-sms-dash">
    <div class="form-row">
        <label for="node-input-loginType"><i class="fa fa-sign-in"></i> Login</label>
        <select id="node-input-loginType" style="width: 70%;">
            <option value="token">Session token</option>
            <option value="credentials">Dashboard credentials</option>
        </select>
    </div>
    <div class="form-row node-type-token">
        <label for="node-input-token"><i class="fa fa-key"></i> Token</label>
        <input type="password" id="node-input-token" placeholder="Session ID">
    </div>
    <div class="form-row node-type-credentials">
        <label for="node-input-customerId"><i class="fa fa-building"></i> Customer ID</label>
        <input type="text" id="node-input-customerId" placeholder="123456">
    </div>
    <div class="form-row node-type-credentials">
        <label for="node-input-username"><i class="fa fa-user"></i> Username</label>
        <input type="text" id="node-input-username" placeholder="dashboard">
    </div>
    <div class="form-row node-type-credentials">
        <label for="node-input-password"><i class="fa fa-lock"></i> Password</label>
        <input type="password" id="node-input-password">
    </div>
    <div class="form-row">
        <label for="node-input-interval"><i class="fa fa-clock-o"></i> Interval</label>
        <input type="number" id="node-input-interval" min="5" step="1">
    </div>
    <div class="form-row">
        <label for="node-input-updateOnly"><i class="fa fa-filter"></i> Changes only</label>
        <input type="checkbox" id="node-input-updateOnly" style="width: auto; vertical-align: top;">
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="BlaulichtSMS Dashboard">
    </div>
</script>

<script type="text/html" data-help-name="bl-sms-dash">
    <p>Polls the blaulichtSMS Dashboard API and emits the current dashboard data.</p>

    <h3>Output</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>The Dashboard API response containing customer data, integrations, alarms and infos.</dd>
    </dl>

    <h3>Configuration</h3>
    <p>Use either an existing session token or the credentials of a dashboard created in the blaulichtSMS web platform.</p>
    <p>The polling interval is specified in seconds and must be at least 5 seconds. Enable <b>Changes only</b> to suppress unchanged responses.</p>

    <h3>Details</h3>
    <p>Expired sessions created from dashboard credentials are renewed automatically after an HTTP 401 response. A manually supplied token cannot be renewed automatically.</p>
    <p><a href="https://github.com/blaulichtSMS/docs/blob/master/dashboard_api_v1.md">blaulichtSMS Dashboard API documentation</a></p>
</script>
