<script type="text/javascript">
    RED.nodes.registerType('bl-sms-dash', {
        category: 'network',
        color: '#F3B567',
        defaults: {
            authType: { value: 'credentials', required: true },
            customerId: {
                value: '',
                validate: function (value) {
                    return this.authType !== 'credentials' || String(value || '').trim().length > 0;
                }
            },
            interval: {
                value: 10,
                required: true,
                validate: function (value) {
                    const interval = Number(value);
                    return Number.isInteger(interval) && interval >= 5 && interval <= 86400;
                }
            },
            updateOnly: { value: true },
            name: { value: '' }
        },
        credentials: {
            token: { type: 'password' },
            username: { type: 'text' },
            password: { type: 'password' }
        },
        inputs: 0,
        outputs: 1,
        outputLabels: ['dashboard data'],
        icon: 'font-awesome/fa-bell',
        paletteLabel: 'blaulichtSMS',
        label: function () {
            return this.name || 'blaulichtSMS';
        },
        labelStyle: function () {
            return this.name ? 'node_label_italic' : '';
        },
        oneditprepare: function () {
            const credentials = this.credentials || {};
            const authTypeInput = $('#node-input-authType');

            // Migrate configuration fields used by versions <= 0.2.0.
            if (!this.customerId && this.kid) {
                $('#node-input-customerId').val(this.kid);
            }
            if (!credentials.username && this.user) {
                $('#node-input-username').val(this.user);
            }
            if (!credentials.has_password && this.password) {
                $('#node-input-password').val(this.password);
            }
            if (!credentials.has_token && this.token) {
                $('#node-input-token').val(this.token);
            }
            if (this.timer && (!this.interval || this.interval === 10)) {
                $('#node-input-interval').val(this.timer);
            }

            if (!this.authType || (this.token && !this.kid && !this.user)) {
                authTypeInput.val('token');
            }

            function updateVisibility() {
                const useToken = authTypeInput.val() === 'token';
                $('.node-type-token').toggle(useToken);
                $('.node-type-credentials').toggle(!useToken);
            }

            authTypeInput.on('change', updateVisibility);
            updateVisibility();
        },
        oneditsave: function () {
            if ($('#node-input-authType').val() === 'token') {
                $('#node-input-customerId').val('');
                $('#node-input-username').val('');
                $('#node-input-password').val('');
            } else {
                $('#node-input-token').val('');
            }
        }
    });
</script>

<script type="text/html" data-template-name="bl-sms-dash">
    <div class="form-row">
        <label for="node-input-authType"><i class="fa fa-sign-in"></i> Authentication</label>
        <select id="node-input-authType" style="width: 70%;">
            <option value="credentials">Dashboard credentials</option>
            <option value="token">Session token</option>
        </select>
    </div>
    <div class="form-row node-type-token">
        <label for="node-input-token"><i class="fa fa-key"></i> Session token</label>
        <input type="password" id="node-input-token" autocomplete="new-password">
    </div>
    <div class="form-row node-type-credentials">
        <label for="node-input-customerId"><i class="fa fa-building"></i> Customer ID</label>
        <input type="text" id="node-input-customerId" placeholder="123456">
    </div>
    <div class="form-row node-type-credentials">
        <label for="node-input-username"><i class="fa fa-user"></i> Username</label>
        <input type="text" id="node-input-username" autocomplete="username">
    </div>
    <div class="form-row node-type-credentials">
        <label for="node-input-password"><i class="fa fa-lock"></i> Password</label>
        <input type="password" id="node-input-password" autocomplete="new-password">
    </div>
    <div class="form-row">
        <label for="node-input-interval"><i class="fa fa-clock-o"></i> Poll interval</label>
        <input type="number" id="node-input-interval" min="5" max="86400" step="1">
    </div>
    <div class="form-row">
        <label for="node-input-updateOnly"><i class="fa fa-filter"></i> Changes only</label>
        <input type="checkbox" id="node-input-updateOnly" style="width: auto; vertical-align: top;">
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="blaulichtSMS">
    </div>
    <div class="form-tips">
        The minimum polling interval is 5 seconds. Credentials and tokens are stored in the Node-RED credential store.
    </div>
</script>

<script type="text/html" data-help-name="bl-sms-dash">
    <p>Receives current alarm and information data from a blaulichtSMS dashboard.</p>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>The unmodified Dashboard API response.</dd>
        <dt>topic <span class="property-type">string</span></dt>
        <dd><code>blaulichtsms/dashboard</code></dd>
        <dt>blaulichtSms <span class="property-type">object</span></dt>
        <dd>Metadata containing <code>receivedAt</code> and <code>changed</code>.</dd>
    </dl>

    <h3>Configuration</h3>
    <p>
        Use the credentials of a dashboard created in the blaulichtSMS web platform. The node signs in automatically and renews an expired session once after an HTTP 401 response.
    </p>
    <p>
        An existing session token can be supplied instead. Manually supplied tokens cannot be renewed automatically.
    </p>
    <p>
        The poll interval is specified in seconds. When <b>Changes only</b> is enabled, unchanged responses are not emitted.
    </p>

    <h3>Error handling</h3>
    <p>
        Network, authentication and response errors are reported through the node status and Node-RED error handling. Repeated identical errors are logged once, and retries use an exponential delay capped at five minutes.
    </p>

    <h3>References</h3>
    <p><a href="https://github.com/blaulichtSMS/docs/blob/master/dashboard_api_v1.md">Official blaulichtSMS Dashboard API documentation</a></p>
    <p>This is an independent community integration and is not an official blaulichtSMS product.</p>
</script>
